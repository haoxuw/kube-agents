# Upgrade-failure catalogue entry 10: add-on and client skew.
# PARKED: scripts/validate_bench_cases.py lists this case under
# FIXTURE_NOT_READY on #2275, which tracks the fleet-shape fixtures to merge
# (scenario issue #2659), until the stale-client-skew role reaches every pool
# project.
#
# The designed role, stale-client-skew on seeded-a: a CronJob,
# stale-kubectl-client in seeded-shapes, runs kubectl v1.29.0 against the
# cluster's own control plane every ten minutes. kubectl is supported one
# minor either side of the server (the Kubernetes version skew policy). This
# client is several minors behind and still succeeds, because /version
# answers any authenticated caller and the policy is a support statement,
# not a refusal. The next control-plane minor moves it one further out. The
# first request shape or API the old client cannot follow turns a green Job
# red.
#
# The prompt names no client, no image and no version. It asks which
# Kubernetes clients in the clusters are outside the version-skew policy for
# the control plane they talk to, whether or not their calls succeed today.
# The answer ends in one declared line per such workload, in a fixed form.
# The deterministic objectives read the planted CronJob's line and nothing
# else. The server's version is the cluster's own and moves with the fleet,
# so the line carries it for the judge and the patterns accept any value
# there. `fleet_upgrade_report.py --readiness` reads the clients for the
# agent: its client-addon-skew rule grades kubectl user agents from the
# audit log and kubectl images from the workloads against the target minor.
# The report is graded, not the route.
#
# Isolation class: read-only (chat prompt). Eligible tier: nightly once the
# role exists.
#
# Mutation safeguard: the client image. A tag within one minor of the
# control plane passes every objective and empties the fixture.
id: upgrades-stale-client-skew-named
name: The client outside the version-skew policy is named before the control plane moves further ahead

prompt: >-
  We plan the next control-plane minor for the seeded clusters in this
  project. Tell me which Kubernetes clients running in them are outside the
  version-skew policy for the control plane they talk to: kubectl, a client
  library, an operator or an add-on. Include clients whose calls still
  succeed today. For each, tell me what breaks as the control plane moves
  further ahead. Read only; change nothing. Name each workload by its
  Deployment, DaemonSet or CronJob name, not by a pod name. End your answer
  with one line per such workload in exactly this form, with no other words
  on the line: "<cluster>/<namespace>/<workload>: client <name> <version>;
  server <version>; within supported skew: <yes|no>".

expected_output: >-
  It reads the images of the workloads on the seeded clusters against each
  cluster's control-plane version (the readiness report's client-addon-skew
  rule reads them too, with the kubectl user agents in the audit log). It
  names stale-kubectl-client in seeded-shapes on seeded-a: a CronJob that
  runs kubectl v1.29.0 (the registry.k8s.io/kubectl:v1.29.0 image) every ten
  minutes against a control plane several minors ahead of it. That is
  outside the one-minor-either-side window kubectl supports. The client
  succeeds today only because /version is served to any authenticated
  client. It says the next minor moves it one further out, and that the
  first request shape or API the old client cannot follow turns the Job
  red. It recommends a kubectl tag within one minor of the control plane and
  performs no change. It cites no CVE identifiers. It ends with the declared
  line for each such workload. The planted one reads "client kubectl
  v1.29.0; server <the cluster's control-plane version>; within supported
  skew: no".

infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: upgrades

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: haoxuw

# The designed role; not in bench/tf/fleet/fixtures.json on main, which is
# why the case is parked.
fixtures:
  - stale-client-skew

verification_spec:
  # Declared lines only, folded and anchored as in the sibling cases. The
  # workload may be named by its CronJob or by a Job or pod it created.
  - name: the-planted-client-has-a-declared-line
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - stale-client-skew
      any_of_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?/seeded-shapes/stale-kubectl-client(?:-[a-z0-9]{5,10}){0,2}: client [^;\n]+; server [^;\n]+; within supported skew: (?:yes|no)$'

  # The client is kubectl at 1.29: the image tag, with or without its `v`
  # and its patch.
  - name: the-declared-line-names-the-stale-client
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - stale-client-skew
      any_of_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?/seeded-shapes/stale-kubectl-client(?:-[a-z0-9]{5,10}){0,2}: client kubectl v?1\.29(?:\.0)?; server [^;\n]+; within supported skew: (?:yes|no)$'
      forbidden_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?/seeded-shapes/stale-kubectl-client(?:-[a-z0-9]{5,10}){0,2}: client (?!kubectl v?1\.29(?:\.0)?;)[^;\n]+; server [^;\n]+; within supported skew: (?:yes|no)$'

  - name: the-declared-line-says-the-client-is-outside-the-skew
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - stale-client-skew
      any_of_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?/seeded-shapes/stale-kubectl-client(?:-[a-z0-9]{5,10}){0,2}: client [^;\n]+; server [^;\n]+; within supported skew: no$'
      forbidden_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?/seeded-shapes/stale-kubectl-client(?:-[a-z0-9]{5,10}){0,2}: client [^;\n]+; server [^;\n]+; within supported skew: (?!no$)[^\n]+$'

  - name: no-invented-cves
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_phrases: ["CVE-"]

  # The CronJob still runs the old client.
  - name: the-planted-client-image-survived-the-run
    role: safeguard
    severity: catastrophic
    check:
      type: fleet_resource_property
      fixture_role: stale-client-skew
      kind: cronjob
      resource_name: stale-kubectl-client
      namespace: seeded-shapes
      path: spec.jobTemplate.spec.template.spec.containers[0].image
      op: eq
      value: registry.k8s.io/kubectl:v1.29.0

# The readiness report names a GPU job with a CUDA pin and says which driver check it could not make
#
# One of the upgrade-failure catalogue's scenario cases
# (docs/designs/upgrade-failure-catalogue.md, entry 18: GPU driver mismatch).
# It grades the readiness report's `gpu-driver` rule in the
# fleet-upgrade-verification skill (scripts/readiness_rules/gpu_driver_mismatch.py),
# through the agent's answer to the fleet readiness question.
#
# The rule reads every template requesting nvidia.com/gpu: the CUDA version
# from the image tag, the driver from the pools carrying the accelerator the
# template selects, at the target's minor in GKE's driver table. A driver below
# the CUDA major's floor is blocking; one below the toolkit's own minimum is a
# risk; an unreadable driver is a risk or unknown with the reason. The seeded
# fleet has no accelerator pool, so the rule reports the CronJob as a risk: no
# pool carries nvidia-l4, the target driver cannot be read, and the CUDA 12.2
# pin stays unchecked. Should the fleet gain an nvidia-l4 pool, the rule
# grades the pin against that pool's driver at the target instead, or reports
# unknown past the driver table's last minor; the declared line reads
# `blocks the upgrade: no` in every one of those outcomes, because R535 and
# later serve CUDA 12.2, and the case grades that the agent names the CronJob
# and does not invent a driver verdict. The blocking path is covered by the
# rule's unit tests; this fleet cannot show it.
#
# What the deterministic checks read, and what they leave to the judge. The
# prompt asks for one fixed-form line per object, and the checks read one token
# from it: the verdict, `blocks the upgrade: <yes|no>`, on any line that names
# the object. Nothing else on the line is graded, not the cluster prefix and
# not the kind field: the declared-line form's earlier cases found that
# anchoring on the rendering graded the agent's formatting rather than its
# judgement. The object's name is the fixture's and appears nowhere in
# the prompt, so a line naming it is the agent having read the report; the
# verdict token is one word from a closed set, so there is no room for a hedge
# on the graded part. A pod of the workload may stand in for it on the line
# (the name plus one or two hash suffixes), as the agent sometimes renders it.
# Each accept is `<name> ... blocks the upgrade: no` on one line, read after
# the harness's trail fold (`fold_decoration`); the forbid is the same name with
# any other value, so a second line about the object that contradicts the
# first fails whatever the right line says. The prose, the reason the rule
# gives, and the recommended remedy are the judge's, against `expected_output`.
# A separate objective reads the worker's commands for the readiness run
# itself: a reply that reaches the right verdict by a hand survey passes the
# line check and fails the route check.
#
# Planted defect required: on slot a, the suspended CronJob cuda-pinned-trainer in seeded-shapes,
# requesting one nvidia.com/gpu, selecting the nvidia-l4 accelerator, with an
# image pinned to CUDA 12.2
# (role cuda-pinned-gpu-job). The role is designed on the fleet-shape fixture
# branch and is not in bench/tf/fleet/fixtures.json yet, so the case waits in
# scripts/validate_bench_cases.py's FIXTURE_NOT_READY on #2275, which tracks the
# fleet-shape fixtures to merge (scenario issue #2667). It carries no
# fleet_resource_property safeguard: that check resolves a role through the
# catalogue, and adding one when the role lands changes what the case grades,
# which needs its own eval run. It carries no other safeguard either: every
# check that reads the run's commands (`worker_commands`, `tool_called` under
# `scope: workers` or `all`) returns `error` rather than a pass on a run with
# no delegated worker, and `tool_called` under `scope: router` sees only the
# delegating turn's own calls, never the worker's; the registered siblings
# upgrades-fleet-readiness-exclusion and
# upgrades-zonal-control-plane-outage-warned carry none for the same reason.
# The prompt's "read only" is the judge's to hold against the transcript.
#
# Isolation class: read-only (chat prompt; the readiness script reads with
# gcloud container and kubectl get and writes only its own record and
# per-member kubeconfig files). Eligible tier: nightly, once the fixture is on
# the pool projects.
id: upgrades-fleet-readiness-cuda-pinned-gpu-job
name: Fleet upgrade readiness names the CUDA-pinned GPU job
prompt: >-
  Check every cluster in this project for its readiness to upgrade to its
  release channel's default version. For each cluster, report what blocks the
  upgrade and what is at risk. Read only: do not change, upgrade or remove
  anything. End your answer with one line per object that the readiness
  report names as a blocker, as a risk, or as a shape it checked and cleared,
  in exactly this form and with no other words on the line:
  "<cluster>/<object name>: kind
  <deployment|statefulset|daemonset|cronjob|pdb|exclusion>; blocks the
  upgrade: <yes|no>". Write each name exactly as the API shows it, with no
  brackets, quotes or parentheses around it. Put any aside on a line of its
  own.
expected_output: >-
  A per-cluster readiness report read during this run. For seeded-a it names
  the CronJob cuda-pinned-trainer in seeded-shapes: it requests nvidia.com/gpu
  on the accelerator nvidia-l4 with an image pinned to CUDA 12.2. With no
  nvidia-l4 pool in the cluster it says the driver the target node image ships
  for it cannot be read and the pin stays unchecked; with such a pool it names
  the driver GKE installs at the target and says it serves CUDA 12.2, or that
  the driver table does not cover the target. It does not call the CronJob a
  blocker and does not invent a driver version. It recommends
  checking the pin against GKE's driver table when a GPU pool exists, and a
  canary GPU pool first. Other clusters' blockers and risks come from the same
  run. It ends with one declared line per object, and the line for
  cuda-pinned-trainer reads "blocks the upgrade: no". It cites no CVE
  identifiers and changes nothing.
infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: upgrades

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: haoxuw

# Named by ROLE, not cluster: bench/tf/fleet/fixtures.json, once the role
# lands there; docs/designs/bench-fleet-catalog.md is the rule.
fixtures:
  - cuda-pinned-gpu-job

verification_spec:
  # The line this case exists for: one naming cuda-pinned-trainer whose verdict is
  # no; the forbid is the same name with any other verdict.
  - name: cuda-pinned-trainer-line-does-not-block
    role: objective
    # assert, not the converge default: the transcript is immutable once the
    # run ends, so polling a failed check would only wait out the timeout.
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - cuda-pinned-gpu-job
      any_of_patterns:
        - '(?m)^[^\n]*(?<![a-z0-9-])cuda-pinned-trainer(?:-[a-z0-9]{5,10}){0,2}(?![a-z0-9-])[^\n]*; blocks the upgrade: no\s*$'
      forbidden_patterns:
        - '(?m)^[^\n]*(?<![a-z0-9-])cuda-pinned-trainer(?:-[a-z0-9]{5,10}){0,2}(?![a-z0-9-])[^\n]*; blocks the upgrade: (?!no\s*$)'

  # The route: the skill's readiness run, in a delegated worker's commands,
  # however it was invoked (relative or absolute path, with or without flags
  # ahead of the mode). The persona routes a fleet readiness question to this
  # one run; a hand kubectl survey that reaches the right verdict fails here.
  - name: the-readiness-run-happened
    role: objective
    mode: assert
    check:
      type: worker_commands
      required_patterns:
        - '(python3?\s+(-\S+\s+)*|/|^)\S*fleet_upgrade_report\.py\b[^\n|;&]*\s--readiness\b'

  - name: no-invented-cves
    role: objective
    mode: assert
    check:
      type: report_contains
      # No vulnerability feed; a CVE id in a readiness report is an invention.
      forbidden_phrases: ["CVE-"]

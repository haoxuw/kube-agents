# Upgrade-failure catalogue entry 13 (docs/designs/upgrade-failure-catalogue.md):
# the container runtime changes. The fixture is the containerd-socket-agent role
# on slot a: node-runtime-probe, a DaemonSet in seeded-shapes that mounts
# /run/containerd/containerd.sock from the host, the agent shape a containerd
# major change breaks. The role is designed and not yet on the pool projects, so
# this case waits in scripts/validate_bench_cases.py's FIXTURE_NOT_READY under
# #2275 (the tracker the closed scenario issue #2662 redirects to) and runs
# nowhere until the pull request that moves it to the nightly file cites a
# reconcile that planted the role on every pool project.
#
# The readiness mode of fleet-upgrade-verification grades the entry with its
# container-runtime rule: the workload side is every pod or template mounting a
# runtime socket, the runtime side the containerd major each pool's nodes report
# against the major the target's node image ships. The REGULAR clusters already
# run containerd 2, so on the fleet as it stands the agent is named as a socket
# client with no major change at the target: a note, not a blocker. What the
# case grades is that the agent is named with its kind and namespace and that
# it is not called a blocker; the prose about the runtime version is the
# judge's. The prompt asks for one declared line per socket client in a fixed
# vocabulary; the deterministic objectives read those lines and nothing else.
#
# `{cluster:a}` expands to the cluster the runner recorded for slot a.
#
# Isolation class: read-only (chat prompt; the script reads with gcloud
# container and kubectl get and writes only its own record and per-member
# kubeconfig files). Eligible tier: nightly once the fixture is on the pool.
#
# No deterministic mutation safeguard yet: the role is not in the fleet
# catalogue on main, so a fleet_resource_property check on the DaemonSet's
# socket volume has no probe to ground on; the pull request that unparks the
# case adds the check with the role's probe list.
id: upgrades-readiness-containerd-socket
name: Upgrade readiness names the agent that mounts the container runtime socket

prompt: >-
  For every cluster in this project, run the upgrade readiness check against
  each cluster's release channel default and tell me which workloads talk to
  the container runtime through its socket mounted from the node, which node
  pools change containerd major at the target, and whether either stops the
  upgrade. Read only; change and upgrade nothing. End your answer with one line
  per workload that mounts the runtime socket, in exactly this form, no other
  words on the line: "<cluster>/<namespace>/<name>: kind <kind>; mounts the
  runtime socket: yes; blocks the upgrade: <yes|no>", and for a cluster with no
  such workload the line "<cluster>: no runtime socket clients".

expected_output: >-
  The version table and the readiness table read during this run. On seeded-a
  the DaemonSet node-runtime-probe in seeded-shapes is named as mounting
  /run/containerd/containerd.sock from the host, the shape a containerd major
  change or a CRI API removal breaks. The answer states each pool's current
  containerd major from its nodes and the major the target's node image ships
  (the REGULAR clusters already run containerd 2, so no pool changes major at
  the target) and says the agent is a risk to watch at the next runtime change,
  not a blocker; it recommends moving the agent to the CRI v1 API. It ends with
  the declared line "seeded-a/seeded-shapes/node-runtime-probe: kind DaemonSet;
  mounts the runtime socket: yes; blocks the upgrade: no" and "no runtime socket
  clients" lines for the clusters with none. It cites no CVE identifiers and
  performs no upgrade.

infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: upgrades

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: haoxuw

# Named by ROLE, not cluster: the role this case's issue plants, which the
# fixture catalogue on main does not define yet (FIXTURE_NOT_READY, #2275;
# the scenario's own issue #2662 is closed and redirects there).
fixtures:
  - containerd-socket-agent

verification_spec:
  # The declared line for the planted agent: its cluster, namespace and name,
  # its kind, the socket mount, and that it does not block. A line calling it
  # a blocker, or a "no runtime socket clients" line for its cluster, is the
  # wrong read whatever the prose says.
  - name: the-planted-agent-is-named-and-does-not-block
    role: objective
    # assert, not converge: the transcript is immutable once the run ends.
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - containerd-socket-agent
      any_of_patterns:
        - "(?m)^{cluster:a}/seeded-shapes/node-runtime-probe: kind daemonset; mounts the runtime socket: yes; blocks the upgrade: no$"
      forbidden_patterns:
        - '(?m)^{cluster:a}/seeded-shapes/node-runtime-probe: kind [^;\n]+; mounts the runtime socket: [^;\n]+; blocks the upgrade: (?!no$)[^\n]+$'
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?: no runtime socket clients$'

  - name: no-invented-cves
    role: objective
    mode: assert
    check:
      type: report_contains
      # No vulnerability feed; a CVE id in a readiness report is an invention.
      forbidden_phrases: ["CVE-"]

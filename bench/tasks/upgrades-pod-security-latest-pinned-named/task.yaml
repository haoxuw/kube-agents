# Upgrade-failure catalogue entry 8: a default changes in the new minor.
# PARKED: scripts/validate_bench_cases.py lists this case under
# FIXTURE_NOT_READY on #2275, which tracks the fleet-shape fixtures to merge
# (scenario issue #2657), until the moving-admission-default role reaches
# every pool project.
#
# The designed role, moving-admission-default on seeded-a: a namespace,
# seeded-defaults, whose Pod Security Admission labels enforce and warn at
# baseline with both versions set to `latest`. A `latest` pin follows the
# running minor. The rule set applied to the namespace changes at every minor
# that changes the Pod Security Standards, without anyone editing it. A
# namespace pinned to a named version is the safe case. baseline-edge-worker
# (one replica) is admitted by today's baseline. A check the next minor adds
# to baseline refuses its replacement pods at admission.
#
# The prompt names no namespace and no label value. It asks which namespaces
# carry a Pod Security Admission version that follows the running minor
# instead of naming one. The answer ends in one declared line per such
# namespace, in a fixed form. The deterministic objectives read the planted
# namespace's line and nothing else. The line grades the pin, a fact of the
# labels; whether the next minor changes the enforced checks depends on the
# fleet's version and stays with the judge. `fleet_upgrade_report.py
# --readiness` reads the labels for the agent: its changed-defaults rule names
# a namespace at `latest` whose level a crossed minor tightens, from the
# per-minor table in upgrade_shape_tables.py. The report is graded, not the
# route.
#
# Isolation class: read-only (chat prompt). Eligible tier: nightly once the
# role exists.
#
# Mutation safeguard: the enforce-version label. A pin to a named minor
# passes every objective and empties the fixture.
id: upgrades-pod-security-latest-pinned-named
name: The namespace whose Pod Security version follows the minor is named before the upgrade that moves it

prompt: >-
  We plan the next minor upgrade for the seeded clusters in this project.
  Tell me which namespaces have Pod Security Admission labels whose version
  follows the running minor instead of naming one, so the rule set applied
  to their workloads changes with the upgrade. For each, tell me the level it
  enforces and which workloads that affects. Read only; change nothing. End
  your answer with one line per such namespace in exactly this form, with no
  other words on the line: "<cluster>/<namespace>: enforce
  <privileged|baseline|restricted>; enforce-version <label value>; follows
  the running minor: <yes|no>".

expected_output: >-
  It reads the pod-security.kubernetes.io labels on every namespace of the
  seeded clusters (the readiness report's changed-defaults rule reads them
  too). It names seeded-defaults on seeded-a: enforce baseline and warn
  baseline, both at version latest, so the baseline rule set applied to it
  is whichever the running control plane ships. baseline-edge-worker (one
  replica) is admitted by today's baseline and is what a stricter one would
  refuse at its next rollout or node drain. It says whether the next minor
  changes the baseline checks, from the Pod Security Standards. It
  recommends pinning enforce-version to the current minor and running the
  target minor's rule set in warn and audit before enforce. It performs no
  change and cites no CVE identifiers. It ends with the declared line for
  each such namespace. The planted one reads "enforce baseline;
  enforce-version latest; follows the running minor: yes".

infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: upgrades

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: haoxuw

# The designed role; not in bench/tf/fleet/fixtures.json on main, which is
# why the case is parked.
fixtures:
  - moving-admission-default

verification_spec:
  # Declared lines only, folded and anchored as in the sibling cases. The
  # subject is a namespace, so the line names the cluster and the namespace.
  - name: the-planted-namespace-has-a-declared-line
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - moving-admission-default
      any_of_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?/seeded-defaults: enforce [^;\n]+; enforce-version [^;\n]+; follows the running minor: (?:yes|no)$'

  - name: the-declared-line-says-the-level-is-baseline
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - moving-admission-default
      any_of_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?/seeded-defaults: enforce baseline; enforce-version [^;\n]+; follows the running minor: (?:yes|no)$'
      forbidden_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?/seeded-defaults: enforce (?!baseline;)[^;\n]+; enforce-version [^;\n]+; follows the running minor: (?:yes|no)$'

  - name: the-declared-line-says-the-version-is-latest
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - moving-admission-default
      any_of_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?/seeded-defaults: enforce [^;\n]+; enforce-version latest; follows the running minor: (?:yes|no)$'
      forbidden_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?/seeded-defaults: enforce [^;\n]+; enforce-version (?!latest;)[^;\n]+; follows the running minor: (?:yes|no)$'

  - name: the-declared-line-says-the-pin-follows-the-minor
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - moving-admission-default
      any_of_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?/seeded-defaults: enforce [^;\n]+; enforce-version [^;\n]+; follows the running minor: yes$'
      forbidden_patterns:
        - '(?m)^{cluster:a}(?:\s*\([^)\n]*\))?/seeded-defaults: enforce [^;\n]+; enforce-version [^;\n]+; follows the running minor: (?!yes$)[^\n]+$'

  - name: no-invented-cves
    role: objective
    mode: assert
    check:
      type: report_contains
      forbidden_phrases: ["CVE-"]

  # The namespace's enforce-version label still reads latest. The key
  # carries dots, so it is quoted for the JSONPath parser. The namespace is
  # cluster-scoped, and kubectl ignores the role's namespace for this kind.
  - name: the-planted-version-pin-survived-the-run
    role: safeguard
    severity: catastrophic
    check:
      type: fleet_resource_property
      fixture_role: moving-admission-default
      kind: namespace
      resource_name: seeded-defaults
      namespace: seeded-defaults
      path: 'metadata.labels."pod-security.kubernetes.io/enforce-version"'
      op: eq
      value: latest

# Upgrade-failure catalogue entry 11 (docs/designs/upgrade-failure-catalogue.md):
# the control plane is unreachable for minutes on a zonal cluster. Every seeded
# cluster is zonal, so the fixture is the fleet's own shape and nothing is
# planted for it. upgrades-zonal-control-plane-outage-warned asks the question
# as an operator scheduling an upgrade would; this case asks for the readiness
# report, whose zonal-control-plane rule carries the same fact as a risk on
# every member (a risk, never a block: the upgrade completes, and what fails is
# an API client that does not retry).
#
# What the case grades is that the readiness report says it: per cluster, that
# the control plane is zonal, and that the finding is a risk rather than a
# blocker. The prompt asks for one declared line per seeded cluster in a fixed
# vocabulary; the deterministic objectives read those lines and nothing else,
# the prose is the judge's. An agent that reads the location any other way and
# declares the same lines passes.
#
# The patterns name the slots through `{cluster:<slot>}`, which the verifier
# expands to the cluster the runner recorded for the slot, so a fleet applied
# with another prefix is graded on its own names.
#
# Isolation class: read-only (chat prompt; the script reads with gcloud
# container and kubectl get and writes only its own record and per-member
# kubeconfig files). Eligible tier: nightly from its first merge.
#
# No deterministic mutation safeguard, documented: the condition is a setting
# of the cluster itself (its location), which the fleet's Terraform declares and
# its reconcile keeps; there is no planted object a check could ground on, as
# the sibling case's header records for the same shape.
id: upgrades-readiness-zonal-control-plane
name: Upgrade readiness carries a zonal control plane as a risk on every cluster

prompt: >-
  For every cluster in this project, run the upgrade readiness check against
  each cluster's release channel default and include, per cluster, whether its
  control plane is zonal or regional, what that means for the Kubernetes API
  while the control plane upgrades, and whether that stops the upgrade. Read
  only; change and upgrade nothing. End your answer with one line per seeded
  cluster in exactly this form, no other words on the line: "<cluster>: kind
  Cluster; control plane: <zonal|regional>; blocks the upgrade: <yes|no>".

expected_output: >-
  The version table and the readiness table read during this run, with every
  seeded cluster carrying the zonal control plane as a risk: its location is a
  zone, so the Kubernetes API is unavailable for a short window while GKE
  replaces the one control-plane replica, API clients see errors or timeouts
  for that window, and the running pods are unaffected. The answer says the
  finding does not block the upgrade, recommends scheduling the control-plane
  upgrade in a maintenance window and retries with backoff in API clients, and
  notes that only a regional cluster keeps the API available, which is a
  recreate. It ends with the declared lines, each reading "kind Cluster; control
  plane: zonal; blocks the upgrade: no". It cites no CVE identifiers and
  performs no upgrade.

infrastructure:
  deployer: noop
validated: false

# Slug per docs/designs/domains.yaml.
domain: upgrades

# Who answers when this case flakes -- see bench/CONTRIBUTING.md.
owner: haoxuw

# No planted defect is read: the case depends on the seeded clusters existing
# and being zonal, which is the slots' shape (bench/tf/fleet/variables.tf's
# `zone`), not a role. The four roles below are one per slot, and they are how
# the declared-line objectives tell a cluster the agent missed from a cluster
# the project does not have.
fixtures:
  - crashloop-workload
  - version-laggard
  - drift-outlier
  - zonal-skew-scheduling

verification_spec:
  # One line per seeded cluster, fixed vocabulary, the cluster named at the
  # start of the line; every pattern matches the whole declared frame, anchored
  # at both ends, with the line's decoration folded first. Each value objective
  # also forbids a frame whose value slot holds anything but the right word.
  - name: every-seeded-cluster-has-a-declared-line
    role: objective
    # assert, not converge: the transcript is immutable once the run ends.
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - crashloop-workload
        - version-laggard
        - drift-outlier
        - zonal-skew-scheduling
      any_of_patterns:
        - '(?ms)\A(?=.*^{cluster:a}(?:\s*\([^)\n]*\))?: kind cluster; control plane: [^;\n]+; blocks the upgrade: [^\n]+$)(?=.*^{cluster:b}(?:\s*\([^)\n]*\))?: kind cluster; control plane: [^;\n]+; blocks the upgrade: [^\n]+$)(?=.*^{cluster:c}(?:\s*\([^)\n]*\))?: kind cluster; control plane: [^;\n]+; blocks the upgrade: [^\n]+$)(?=.*^{cluster:d}(?:\s*\([^)\n]*\))?: kind cluster; control plane: [^;\n]+; blocks the upgrade: [^\n]+$)'

  - name: the-declared-lines-say-the-control-plane-is-zonal
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - crashloop-workload
        - version-laggard
        - drift-outlier
        - zonal-skew-scheduling
      any_of_patterns:
        - '(?m)^{cluster:any}(?:\s*\([^)\n]*\))?: kind cluster; control plane: zonal; blocks the upgrade: [^\n]+$'
      forbidden_patterns:
        - '(?m)^{cluster:any}(?:\s*\([^)\n]*\))?: kind cluster; control plane: (?!zonal;)[^;\n]+; blocks the upgrade: [^\n]+$'

  # The grade that makes the line useful: a risk, not a blocker. A report that
  # blocks every cluster on its own location would stop every upgrade.
  - name: the-declared-lines-say-it-does-not-block
    role: objective
    mode: assert
    check:
      type: report_contains
      fold_decoration: true
      fixture_roles:
        - crashloop-workload
        - version-laggard
        - drift-outlier
        - zonal-skew-scheduling
      any_of_patterns:
        - '(?m)^{cluster:any}(?:\s*\([^)\n]*\))?: kind cluster; control plane: [^;\n]+; blocks the upgrade: no$'
      forbidden_patterns:
        - '(?m)^{cluster:any}(?:\s*\([^)\n]*\))?: kind cluster; control plane: [^;\n]+; blocks the upgrade: (?!no$)[^\n]+$'

  - name: no-invented-cves
    role: objective
    mode: assert
    check:
      type: report_contains
      # No vulnerability feed; a CVE id in a readiness report is an invention.
      forbidden_phrases: ["CVE-"]
